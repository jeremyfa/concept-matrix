name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifacts but do not create a release
        type: boolean
        default: true

# The artifacts come from bundles.yml, the same workflow ci.yml runs for every
# push to main. This one only adds the publishing.

permissions:
  contents: write

jobs:

  bundles:
    uses: ./.github/workflows/bundles.yml
    # The signing secrets, when the repository has them.
    secrets: inherit

  release:
    name: Publish
    needs: bundles
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundles-*
          merge-multiple: true

      # The web build is an artifact as a folder (see bundles.yml). A release
      # publishes it as a zip, with the folder as its single top-level entry.
      - uses: actions/download-artifact@v4
        with:
          path: web
          pattern: '*-web'

      - name: Zip the web build
        run: |
          cd web
          for dir in *; do zip -qr "../artifacts/$dir.zip" "$dir"; done

      - name: List what will be published
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          # A draft, on purpose. Someone should open the macOS disk image and
          # the Linux AppImage on a real machine before this becomes a
          # download other people get.
